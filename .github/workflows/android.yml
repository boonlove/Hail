name: Android CI

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches:
      - 'master'
    paths:
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradle/**'
      - '.github/workflows/android.yml'

jobs:
  build:
    name: Android CI
    runs-on: ubuntu-latest

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: 配置 JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # 接受使用条款以抑制缓存许可警告。
          build-scan-terms-of-use-url: 'https://gradle.com/terms-of-service'
          build-scan-terms-of-use-agree: 'yes'
          build-scan-publish: false

      - name: 解码签名密钥
        run: |
          mkdir -p keystore
          echo "${{ secrets.SIGNING_KEY_STORE_BASE64 }}" | base64 --decode > keystore/Hail.keystore
          {
            echo "storeFile=keystore/Hail.keystore"
            echo "keyAlias=${{ secrets.SIGNING_KEY_ALIAS }}"
            echo "keyPassword=${{ secrets.SIGNING_KEY_PASSWORD }}"
            echo "storePassword=${{ secrets.SIGNING_STORE_PASSWORD }}"
          } > keystore.properties

      - name: 构建 Hail
        run: chmod + gradlew && ./gradlew assembleRelease

      - name: 上传 Hail
        uses: actions/upload-artifact@v7
        with:
          path: app/build/outputs/apk/release/*.apk
          retention-days: 10
          archive: false
